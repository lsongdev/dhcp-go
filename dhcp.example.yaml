# dhcp-go configuration. Copy to dhcp.yaml and run: dhcp-go -config dhcp.yaml
# The web UI saves server settings back to this file.

# Web UI and API. Keep it on loopback, or set a password.
listen: 127.0.0.1:8067
# HTTP basic authentication (any user name); DHCP_GO_PASSWORD overrides it.
password: ""

# Runtime data: reservations and leases (relative to this configuration).
state_file: dhcp.state.yaml

server:
  # Only one DHCP server should answer on a network: turn off the router's
  # DHCP server (or any other) on this network before enabling this one.
  enabled: false
  interface: eth0
  range_start: 192.168.1.100
  range_end: 192.168.1.200
  router: 192.168.1.1
  dns: [192.168.1.1]
  domain: lan
  lease_time: 43200 # seconds
